name: Office compatibility probes
on:
  workflow_call:
    inputs:
      probe_case:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      probe_case:
        description: Committed exchange probe to execute
        type: choice
        default: all
        options: [all, master-page-raw, master-page-control, master-page-normalized, landscape-ending, sequential-columns, word-balanced-columns, odt-furniture, word-furniture, odt-section-geometry, word-section-geometry, odt-section-numbering, word-section-numbering, odt-section-restarts, word-section-restarts]
permissions:
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install runner-only editor and validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-fitz python3-lxml fonts-liberation fonts-crosextra-carlito
      - run: npm ci
      - name: Actual editor exchange and rendered evidence
        env:
          PROBE_CASE: ${{ inputs.probe_case }}
        run: /usr/bin/python3 scripts/office-probes.py --case "$PROBE_CASE" --output office-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: office-results
          path: office-results/
          if-no-files-found: error
          retention-days: 14
