name: Release checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_scope:
        description: Diagnostic subset (manual runs cannot be promoted)
        type: choice
        default: all
        options: [all, redaction-webkit]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_plan.py plan --base "$BASE_SHA" --event "$EVENT_NAME"
  build:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  node:
    needs: [plan, build]
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: dist/
      - run: npm test 2>&1 | tee node-tests.log
      - name: Node summary
        if: always()
        run: node scripts/ci-report.mjs node node-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: node-results
          path: node-tests.log
          retention-days: 14
  tooling:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-tooling.py
  browser:
    needs: [plan, build]
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'redaction-webkit' && '["desktop-webkit","phone-webkit"]' || '["desktop-chromium","desktop-firefox","desktop-webkit","phone-chromium","phone-webkit"]') }}
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
      options: --ipc=host
    env:
      BROWSER_PROJECT: ${{ matrix.project }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: dist/
      - name: Match browser profile directory ownership
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Full profile
        if: github.event_name != 'workflow_dispatch' || inputs.browser_scope != 'redaction-webkit'
        run: npm run test:browser -- --project="$BROWSER_PROJECT" --max-failures=1 --reporter=list,html,json
      - name: Redaction diagnosis
        if: github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'redaction-webkit'
        run: npm run test:browser -- e2e/redaction.spec.mjs --project="$BROWSER_PROJECT" --max-failures=1 --reporter=list,html,json
      - name: Browser summary
        if: always()
        run: node scripts/ci-report.mjs browser playwright-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results-${{ matrix.project }}
          path: |
            playwright-results.json
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
  office:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    uses: ./.github/workflows/office-probes.yml
    with:
      probe_case: all
  verify:
    needs: [plan, build, node, tooling, browser, office]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every planned check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py gate
