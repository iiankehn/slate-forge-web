name: Pages promotion checks
on:
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - .github/workflows/promotion-checks.yml
      - scripts/promote-pages.py
      - test/pages-promotion_test.py
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - .github/workflows/promotion-checks.yml
      - scripts/promote-pages.py
      - test/pages-promotion_test.py
permissions:
  contents: read
jobs:
  promotion-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test/pages-promotion_test.py
