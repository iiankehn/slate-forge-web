name: Publish GitHub Pages
# Explicitly promote a previously verified main artifact. Never rebuild/retest it.
on:
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Successful main push run ID from Release checks
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve and verify the exact successful CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_CI_RUN_ID: ${{ inputs.verification_run_id }}
        run: python3 scripts/promote-pages.py --run-id "$VERIFIED_CI_RUN_ID" --output "$RUNNER_TEMP/slate-pages-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/slate-pages-site
  deploy:
    needs: promote
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
