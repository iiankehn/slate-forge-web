name: Suggest an improvement
description: Describe an experience you would like Slate Forge to support.
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Explain the task and what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
    validations:
      required: true
